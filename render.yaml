services:
  - type: web
    name: facecode-runner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.runner
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: facecode-runner-secrets
      - key: FACECODE_RUNNER_CONCURRENCY
        value: "1"
      - key: FACECODE_RUNNER_TIMEOUT
        value: "5"

  - type: web
    name: facecode-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - fromGroup: facecode-runner-secrets
      - key: FACECODE_ENV
        value: production
      - key: FACECODE_SECRET_KEY
        generateValue: true
      - key: FACECODE_RUNNER_URL
        value: http://facecode-runner:8080
      - key: FACECODE_DATA_DIR
        value: /tmp/facecode-data
      - key: FACECODE_TRUSTED_HOSTS
        value: "*"
      - key: FACECODE_RETENTION_DAYS
        value: "30"

  - type: web
    name: facecode
    runtime: docker
    plan: free
    dockerfilePath: ./Frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: BACKEND_URL
        value: http://facecode-backend:8000

envVarGroups:
  - name: facecode-runner-secrets
    envVars:
      - key: FACECODE_RUNNER_SECRET
        generateValue: true
